# =============================================================================
# docker-compose.yml — NLQueries OSS stack
#
# Quickstart:
#   cp .env.example .env
#   # edit .env — set DATABASE_URL, your LLM API key, and QDRANT_API_KEY
#   #   (generate one with: openssl rand -hex 32)
#   docker compose up
#
#   Once running:
#   docker exec -it nlqueries-core nlqueries connect postgres \
#       --host host.docker.internal --database mydb --user me --password YOUR_PASSWORD
#   docker exec -it nlqueries-core nlqueries ask postgres:localhost:mydb \
#       "How many orders this week?"
#
# Tier: [OSS] — github.com/nlqueries/nlqueries (BSL 1.1)
# =============================================================================

services:

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: nlqueries-qdrant
    restart: unless-stopped
    environment:
      # Qdrant is a write path into the semantic cache, and cached SQL is
      # executed against your database. An anonymous writer here reached a
      # committed side effect in an audit, so the key is required rather than
      # optional; the app refuses to start without it for a non-loopback URL.
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?set QDRANT_API_KEY in .env, generate one with openssl rand -hex 32}"
    ports:
      # Loopback by default. The app reaches Qdrant over the compose network,
      # so publishing these binds them for host tools only — and on a cloud
      # host, 0.0.0.0 published an unauthenticated vector store to the internet.
      - "${BIND_ADDR:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${BIND_ADDR:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    # No capabilities are needed to listen and read a volume, and a process that
    # cannot acquire new privileges cannot escalate through a setuid binary.
    #
    # `read_only` is deliberately absent. Measured against qdrant/qdrant:v1.9.3,
    # which is what this file pinned when the measurement was made:
    # the process panics at startup on a read-only root filesystem. The
    # container image is the vendor's, so the paths it writes are theirs to
    # change; applying the setting would trade a running service for a hardening
    # claim.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - nlqueries
    healthcheck:
      # The qdrant/qdrant image ships neither wget, curl nor nc, so an
      # HTTP-client probe can never pass: the service stays unhealthy and
      # nlqueries-core, which waits on `condition: service_healthy`, never
      # starts. bash is present, so the REST port is probed with its /dev/tcp
      # pseudo-device. Same probe as the enterprise compose file, where this was
      # found and fixed first.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nlqueries-core:
    image: nlqueries/core:latest
    # To build from source instead of pulling: docker compose build
    container_name: nlqueries-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
      # The server binds 0.0.0.0 *inside the container*; the ports mapping below
      # publishes it on the host's loopback only, and that is the actual
      # boundary. Setting this here rather than in the image means one
      # deployment's decision, not every `docker run`'s.
      NLQ_ALLOW_INSECURE_BIND: "1"
      QDRANT_API_KEY: "${QDRANT_API_KEY:?set QDRANT_API_KEY in .env, generate one with openssl rand -hex 32}"
      # The model cache is written at first use. With a read-only root
      # filesystem the default location under $HOME is not writable, so it is
      # placed on the data volume, where it also survives a restart: measured,
      # a second start needs no network.
      XDG_CACHE_HOME: /data/nlqueries/cache
      HF_HOME: /data/nlqueries/cache/huggingface
    # Nothing here writes outside the data volume and /tmp. Measured: the MCP
    # server starts, listens, and embeds text under all of the following.
    read_only: true
    tmpfs:
      # noexec and nosuid: scratch space is not a place to run anything from.
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A bound on what a runaway query or a fork bomb can consume. Raise
    # mem_limit if the embedding model is changed for a larger one.
    pids_limit: 256
    mem_limit: 4g
    volumes:
      - nlqueries-data:/data/nlqueries
    ports:
      # Loopback, like the Qdrant ports above. The MCP server has no
      # authentication: published on every interface, this is a database-query
      # API open to whatever can route to the host.
      - "${BIND_ADDR:-127.0.0.1}:${MCP_PORT:-8080}:8080"
    networks:
      - nlqueries
    depends_on:
      qdrant:
        condition: service_healthy

networks:
  nlqueries:
    driver: bridge

volumes:
  qdrant-data:
    driver: local
  nlqueries-data:
    driver: local
