# =============================================================================
# docker-compose.yml — NLQueries OSS stack
#
# Quickstart:
#   cp .env.example .env
#   # edit .env — set DATABASE_URL, your LLM API key, and QDRANT_API_KEY
#   #   (generate one with: openssl rand -hex 32)
#   docker compose up
#
#   Once running:
#   docker exec -it nlqueries-core nlqueries connect postgres \
#       --host host.docker.internal --database mydb --user me --password s3cr3t
#   docker exec -it nlqueries-core nlqueries ask postgres:localhost:mydb \
#       "How many orders this week?"
#
# Tier: [OSS] — github.com/nlqueries/nlqueries (BSL 1.1)
# =============================================================================

services:

  qdrant:
    image: qdrant/qdrant:v1.9.3
    container_name: nlqueries-qdrant
    restart: unless-stopped
    environment:
      # Qdrant is a write path into the semantic cache, and cached SQL is
      # executed against your database. An anonymous writer here reached a
      # committed side effect in an audit, so the key is required rather than
      # optional; the app refuses to start without it for a non-loopback URL.
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?set QDRANT_API_KEY in .env, generate one with openssl rand -hex 32}"
    ports:
      # Loopback by default. The app reaches Qdrant over the compose network,
      # so publishing these binds them for host tools only — and on a cloud
      # host, 0.0.0.0 published an unauthenticated vector store to the internet.
      - "${BIND_ADDR:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${BIND_ADDR:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - nlqueries
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nlqueries-core:
    image: nlqueries/core:latest
    # To build from source instead of pulling: docker compose build
    container_name: nlqueries-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: "http://qdrant:6333"
      # The server binds 0.0.0.0 *inside the container*; the ports mapping below
      # publishes it on the host's loopback only, and that is the actual
      # boundary. Setting this here rather than in the image means one
      # deployment's decision, not every `docker run`'s.
      NLQ_ALLOW_INSECURE_BIND: "1"
      QDRANT_API_KEY: "${QDRANT_API_KEY:?set QDRANT_API_KEY in .env, generate one with openssl rand -hex 32}"
    volumes:
      - nlqueries-data:/data/nlqueries
    ports:
      # Loopback, like the Qdrant ports above. The MCP server has no
      # authentication: published on every interface, this is a database-query
      # API open to whatever can route to the host.
      - "${BIND_ADDR:-127.0.0.1}:${MCP_PORT:-8080}:8080"
    networks:
      - nlqueries
    depends_on:
      qdrant:
        condition: service_healthy

networks:
  nlqueries:
    driver: bridge

volumes:
  qdrant-data:
    driver: local
  nlqueries-data:
    driver: local
