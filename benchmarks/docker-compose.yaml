version: "3.9"

# Benchmark infrastructure: Postgres + Qdrant + embedding server.
# Start with: docker compose -f benchmarks/docker-compose.yaml up -d
# Stop  with: docker compose -f benchmarks/docker-compose.yaml down

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: nlq
      POSTGRES_PASSWORD: nlq
      POSTGRES_DB: nlq_bench
    ports:
      # Loopback by default: this database is seeded with benchmark fixtures and
      # its credentials are in this file, so publishing it on every interface
      # offers a trivially reachable Postgres to the whole network. Override
      # BIND_ADDR only if the benchmark driver runs off-host.
      - "${BIND_ADDR:-127.0.0.1}:5433:5432"    # 5433 to avoid conflict with a local Postgres on 5432
    volumes:
      - postgres_bench_data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlq -d nlq_bench"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    # v1.18.2; this file previously pinned v1.9.2, and v1.18.2 will not open a
    # `qdrant_bench_data` volume written by it -- the container panics at
    # startup. Remove the volume by name; a benchmark run rebuilds its fixtures,
    # so nothing there is worth preserving. See "Upgrading an existing Qdrant"
    # in docs/qdrant-setup.md.
    image: qdrant/qdrant:v1.18.2
    ports:
      # Loopback by default, as in the top-level compose file: this Qdrant runs
      # with no API key, so a wildcard bind publishes an unauthenticated vector
      # store.
      - "${BIND_ADDR:-127.0.0.1}:6334:6333"    # 6334 to avoid conflict with a local Qdrant on 6333
    volumes:
      - qdrant_bench_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_bench_data:
  qdrant_bench_data:
