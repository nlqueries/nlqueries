name: Release — PyPI Publish

# Triggered on a pushed tag of the form v<major>.<minor>.<patch>
# (e.g. v0.2.0, v1.0.0-rc1).  No stored secrets required — uses
# PyPI's Trusted Publishing (OIDC) via pypa/gh-action-pypi-publish.
#
# Required one-time setup in PyPI:
#   1. Go to https://pypi.org/manage/project/nlqueries-core/settings/publishing/
#   2. Add a "GitHub Actions" publisher:
#      - Owner:      nlqueries
#      - Repository: nlqueries
#      - Workflow:   release.yml
#      - Environment: pypi

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  # ---------------------------------------------------------------------------
  # 1. Run the full CI suite before publishing (belt-and-suspenders)
  # ---------------------------------------------------------------------------
  ci:
    name: CI checks (lint + tests)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"
        working-directory: ${{ github.workspace }}

      - name: Ruff lint
        run: ruff check .
        working-directory: ${{ github.workspace }}

      - name: Ruff format check
        run: ruff format --check .
        working-directory: ${{ github.workspace }}

      - name: Mypy
        run: mypy nlqueries/
        working-directory: ${{ github.workspace }}

      - name: Pytest
        run: pytest --tb=short -q
        working-directory: ${{ github.workspace }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # ---------------------------------------------------------------------------
  # 2. Build the source distribution and wheel
  # ---------------------------------------------------------------------------
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    needs: [ci]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build
        working-directory: ${{ github.workspace }}

      - name: Store distribution packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Publish to PyPI using OIDC trusted publishing (no stored secrets)
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/nlqueries-core

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # No api_token needed — trusted publishing uses OIDC
        with:
          print-hash: true

  # ---------------------------------------------------------------------------
  # 4. Build and push Docker image to Docker Hub
  # ---------------------------------------------------------------------------
  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [ci]   # run in parallel with PyPI build, not after it

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            nlqueries/core:latest
            nlqueries/core:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 5. Create a GitHub Release with the built artifacts attached
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-pypi]
    permissions:
      contents: write   # required to create releases

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history for changelog extraction

      - name: Download distribution packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            dist/* \
            --title "nlqueries-core ${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            --verify-tag

  # ---------------------------------------------------------------------------
  # 6. Trigger chat index rebuild on nlqueries-website-chat
  # ---------------------------------------------------------------------------
  trigger-reindex:
    name: Trigger chat index rebuild
    runs-on: ubuntu-latest
    needs: [github-release]

    steps:
      - name: Dispatch core-repo-updated to nlqueries-website-chat
        env:
          CHAT_REPO_PAT: ${{ secrets.CHAT_REPO_PAT }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CHAT_REPO_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nlqueries/nlqueries-website-chat/dispatches \
            -d '{"event_type":"core-repo-updated"}'
