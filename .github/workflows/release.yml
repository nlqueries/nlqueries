name: Release — PyPI Publish

# Triggered on a pushed tag of the form v<major>.<minor>.<patch>
# (e.g. v0.2.0, v1.0.0-rc1).  No stored secrets required — uses
# PyPI's Trusted Publishing (OIDC) via pypa/gh-action-pypi-publish.
#
# Required one-time setup in PyPI:
#   1. Go to https://pypi.org/manage/project/nlqueries-core/settings/publishing/
#   2. Add a "GitHub Actions" publisher:
#      - Owner:      nlqueries
#      - Repository: nlqueries
#      - Workflow:   release.yml
#      - Environment: pypi
#
# Dry run: `gh workflow run release.yml --ref <branch>` (or "Run workflow" in
# the Actions tab) runs `ci` and `build` as a release would, then
# `release-dry-run`, which downloads the built packages and builds the
# multi-platform image without pushing it. Every job that publishes is
# skipped, so a dry run requests no environment, no OIDC token and no
# secret. Use it to exercise a change to this file, or a bump of the actions
# it pins, before a real tag does.
#
# Only a final version tag (vX.Y.Z, nothing after it) moves
# nlqueries/core:latest. A pre-release tag such as v1.0.0-rc1 pushes its own
# image tag and nothing else. docker-compose.yml pins the image by version, not
# :latest, so cutting a final release includes bumping that pin, and the tag
# shown in README.md and docs/getting-started.md, to the new version.
# tests/test_release_pins_its_own_image.py holds all three to pyproject.toml's
# version, and the `versions` job below holds a final tag to it.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

# The publishing jobs widen this for themselves: `publish-pypi` adds
# id-token for trusted publishing, `github-release` adds contents: write.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Run the full CI workflow before publishing
  #    ci.yml itself, called as a reusable workflow, so everything below
  #    waits on every one of its jobs: lint, type-check, the test matrix, both
  #    pip-audit scans, the gitleaks secret scan and the import-boundary
  #    check. The pytest environment, TESTCONTAINERS_RYUK_DISABLED included,
  #    is set there and nowhere else.
  # ---------------------------------------------------------------------------
  ci:
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # 1b. The tag names the version pyproject.toml declares
  #     The tests in `ci` hold docker-compose.yml's image pin to pyproject's
  #     version; this holds a final tag to it, so a release cannot publish a
  #     compose file that runs another release's image. v0.4.0 did: its
  #     compose file pinned 0.3.0. A pre-release tag (v1.0.0-rc1) is spelled
  #     differently from its PEP 440 version (1.0.0rc1) and does not move the
  #     pin, so it is not compared. Neither is a dry run, which has no tag.
  # ---------------------------------------------------------------------------
  versions:
    name: Tag matches pyproject version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the tag with pyproject.toml
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Not a tag (${GITHUB_REF}): nothing to compare."
            exit 0
          fi
          tag="${GITHUB_REF#refs/tags/v}"
          if [[ ! "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Pre-release tag v${tag}: not compared."
            exit 0
          fi
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${version}" != "${tag}" ]]; then
            echo "::error::Tag v${tag} does not match pyproject.toml version ${version}."
            exit 1
          fi
          echo "Tag v${tag} matches pyproject.toml."

  # ---------------------------------------------------------------------------
  # 2. Build the source distribution and wheel
  # ---------------------------------------------------------------------------
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    needs: [ci, versions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build
        working-directory: ${{ github.workspace }}

      - name: Store distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2b. A CycloneDX SBOM of the wheel
  #     Its own job, so the step most likely to fail (it resolves the wheel's
  #     whole dependency closure from PyPI) cannot stop the packages being
  #     stored or published. `publish-pypi` does not wait on it; only
  #     `github-release`, which attaches it and can be re-run, does.
  # ---------------------------------------------------------------------------
  wheel-sbom:
    name: Build the wheel's SBOM
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      # The wheel is installed into a virtualenv created without pip, by the
      # runner's pip, so the environment holds the wheel and its dependencies
      # and nothing else: no pip or setuptools, and not the generator, which
      # runs from the runner's own Python. The resolution is the one for this
      # runner, linux/amd64 and CPython 3.11, on the day of the release.
      - name: Generate the wheel's SBOM (CycloneDX)
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/wheel-env"
          pip --python "$RUNNER_TEMP/wheel-env/bin/python" install --no-cache-dir dist/*.whl
          pip install "cyclonedx-bom==7.5.0"
          wheel="$(basename dist/*.whl)"
          mkdir -p sbom
          cyclonedx-py environment \
            --pyproject pyproject.toml \
            --mc-type library \
            --of JSON \
            -o "sbom/${wheel}.cdx.json" \
            "$RUNNER_TEMP/wheel-env/bin/python"

      # Not in dist/: the PyPI upload takes every file there.
      - name: Store the wheel's SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-sbom
          path: sbom/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Publish to PyPI using OIDC trusted publishing (no stored secrets)
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/nlqueries-core

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        # No api_token needed — trusted publishing uses OIDC
        with:
          print-hash: true

  # ---------------------------------------------------------------------------
  # 4. Build and push Docker image to Docker Hub
  # ---------------------------------------------------------------------------
  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [ci, versions]   # run in parallel with PyPI build, not after it
    if: github.event_name == 'push'
    # Holds DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, and is restricted to v*
    # tags with a required reviewer, so the credentials reach only this job
    # on a release. A dry run builds the image in `release-dry-run` instead.
    environment: dockerhub

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `latest` follows final versions only: v1.2.3 pushes 1.2.3 and latest,
      # v1.2.3-rc1 pushes 1.2.3-rc1 alone, so a plain `docker pull` never
      # lands on a pre-release.
      - name: Choose image tags
        id: tags
        shell: bash
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          tags="nlqueries/core:${version}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="${tags},nlqueries/core:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # A BuildKit SBOM attestation per platform, pushed with the image.
          # Read it with:
          #   docker buildx imagetools inspect nlqueries/core:<version> \
          #     --format '{{ json .SBOM }}'
          # The scanner BuildKit runs to produce it is pinned by digest, like
          # the base image and every action here, so the same commit builds the
          # same SBOM and a change to the `stable-1` tag cannot fail a release
          # part-way through. The tag is kept beside the digest for
          # readability. To update, deliberately:
          #   docker buildx imagetools inspect docker/buildkit-syft-scanner:stable-1
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 4b. Dry run: on a manual run only, everything a release does short of
  #     publishing. It downloads the packages `build` stored and the SBOM
  #     `wheel-sbom` stored, as `publish-pypi` and `github-release` do, and
  #     builds the same multi-platform image as `publish-docker` with
  #     push: false. The image is exported as an OCI tarball to /dev/null
  #     rather than discarded, so the build has an exporter to attach its
  #     SBOM attestations to and the SBOM generator runs here first, without
  #     writing both platforms' layers to the runner's disk. Same
  #     pinned actions as those jobs, so an action bump runs here first. No
  #     environment and no secrets: docker/login-action and the PyPI upload
  #     are the two steps a dry run cannot exercise.
  # ---------------------------------------------------------------------------
  release-dry-run:
    name: Release dry run (nothing published)
    runs-on: ubuntu-latest
    needs: [build, wheel-sbom]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Download the wheel's SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-sbom
          path: sbom/

      - name: List the packages a release would upload
        run: ls -l dist/ sbom/

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: nlqueries/core:dry-run
          # Same generator as publish-docker.
          sbom: generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          # Without an exporter there is nothing to attach an SBOM to. The
          # OCI exporter generates and exports both platforms and their
          # attestations, and /dev/null keeps the multi-GB tarball off the
          # runner's disk.
          outputs: type=oci,dest=/dev/null
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 5. Create a GitHub Release with the built artifacts attached
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # wheel-sbom too: a failed SBOM holds back only this job, which can be
    # re-run once the packages are already on PyPI.
    needs: [publish-pypi, wheel-sbom]
    if: github.event_name == 'push'
    permissions:
      contents: write   # required to create releases

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history for changelog extraction

      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Download the wheel's SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-sbom
          path: sbom/

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            dist/* sbom/* \
            --title "nlqueries-core ${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            --verify-tag

  # ---------------------------------------------------------------------------
  # 6. Trigger chat index rebuild on nlqueries-website-chat
  # ---------------------------------------------------------------------------
  trigger-reindex:
    name: Trigger chat index rebuild
    runs-on: ubuntu-latest
    needs: [github-release]
    if: github.event_name == 'push'

    steps:
      - name: Dispatch core-repo-updated to nlqueries-website-chat
        env:
          CHAT_REPO_PAT: ${{ secrets.CHAT_REPO_PAT }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CHAT_REPO_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nlqueries/nlqueries-website-chat/dispatches \
            -d '{"event_type":"core-repo-updated"}'
