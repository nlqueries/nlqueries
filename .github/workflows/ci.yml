name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  # Run it on demand, against any ref.
  #
  # A GitHub Actions outage on 2026-08-26 created run objects, assigned no
  # runners, and failed them in seconds. Those runs cannot be retried, and once
  # the queue recovered nothing re-fired for commits that had already landed —
  # so `main` carried merges no CI had ever seen, which is indistinguishable
  # from `main` being green. Without this trigger the only remedy was an empty
  # commit.
  workflow_dispatch:
  # Called by release.yml as its `ci` job, so a release waits on every job
  # below, not on a copy of some of them. A called workflow runs with the
  # caller's event and ref: on a tag push it checks out the tag.
  workflow_call:

# Nothing here writes to the repository. A called workflow can only narrow
# what its caller grants, so this holds for release.yml's run as well.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 1. Import-boundary enforcement
  #    Fails if ANY file in core/nlqueries/ imports from the enterprise layer.
  #    Two independent checks for belt-and-suspenders coverage.
  # -------------------------------------------------------------------------
  boundary-check:
    name: Import boundary (core must not import enterprise)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Check 1: ruff TID251 (flake8-tidy-imports banned-api)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Ruff — banned-api (TID251)
        # --select TID251 scopes to the banned-import rule only.
        # Any import of `enterprise` or `nlqueries_enterprise` inside
        # nlqueries/ will cause a non-zero exit and fail this job.
        run: ruff check nlqueries/ --select TID251
        working-directory: ${{ github.workspace }}

      # Check 2: grep fallback — catches dynamic imports, __import__(), etc.
      - name: Grep — no enterprise imports in core
        run: |
          echo "Scanning core/nlqueries/ for enterprise imports..."
          if grep -rn \
               --include="*.py" \
               -E "(^|\s)(import|from)\s+(enterprise|nlqueries_enterprise)\b" \
               nlqueries/; then
            echo ""
            echo "ERROR: Found import(s) from the enterprise layer inside core/."
            echo "core/ must be standalone — it must never depend on enterprise/."
            exit 1
          fi
          echo "OK — no enterprise imports found."
        working-directory: ${{ github.workspace }}

  # -------------------------------------------------------------------------
  # 2. Dependency CVE audit
  # -------------------------------------------------------------------------
  security:
    name: Dependency CVE scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev extras
        run: pip install -e ".[dev,docs]"

      - name: pip-audit
        run: |
          pip install pip-audit
          # Patch the environment's build tooling before auditing: setuptools 79.x
          # is flagged by PYSEC-2026-3447 (fixed in 83.0.0). Upgrading resolves it
          # for real (a fix exists), rather than ignoring the advisory.
          pip install --upgrade "setuptools>=83.0.0"
          # --skip-editable: nlqueries-core is installed as -e . and is not on PyPI.
          pip-audit --skip-editable

  # -------------------------------------------------------------------------
  # 2b. Dependency CVE audit of the shipped lock
  #    The job above audits what `pip install -e ".[dev,docs]"` resolves
  #    today, which is not what the image ships: the image installs
  #    requirements/core.lock. This audits those exact pins and checks each
  #    one's hashes, so a lock that falls behind a fix fails here rather
  #    than at a release. Both are kept: the job above also covers the
  #    `docs` extra, which the lock does not include.
  # -------------------------------------------------------------------------
  lock-audit:
    name: Lock CVE scan (pip-audit, requirements/core.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The version the lock is compiled for (scripts/lock-deps.sh).
          python-version: "3.11"
          # No `cache: pip`: checking hashes downloads the lock's whole closure,
          # torch and the CUDA wheels included, so a cache saved here would be
          # gigabytes. setup-python keys the cache on the dependency files, not
          # the job, so this job could write the entry the other 3.11 jobs
          # restore, and crowd the image build's cache out of the quota. Only
          # pip-audit is installed here, so there is nothing to gain from it.

      - name: pip-audit (lock)
        run: |
          pip install pip-audit
          pip-audit -r requirements/core.lock --require-hashes

  # -------------------------------------------------------------------------
  # 3. Secret scan (SOC 2 REM-02)
  #    gitleaks over the FULL history on every push and PR. A secret committed
  #    once and "removed" later is still in the history and still compromised,
  #    so scanning the tip alone finds nothing and says so confidently.
  # -------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # THE line that makes this job mean anything. checkout defaults to
          # fetch-depth 1 — a single commit — so without this the "full history
          # scan" reads one commit, finds nothing, and passes.
          fetch-depth: 0

      - name: Refuse to scan a shallow clone
        # Rather than scanning a fraction of the history and reporting success.
        # If someone later trims fetch-depth for speed, this fails loudly
        # instead of quietly narrowing what is checked.
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Shallow clone — this scan would cover only part of the history."
            exit 1
          fi
          echo "Scanning $(git rev-list --count --all) commits across all refs"

      - name: gitleaks
        # The binary in a digest-pinned container, not gitleaks/gitleaks-action:
        # that action requires a GITLEAKS_LICENSE for repositories owned by an
        # organisation, and this one is. Pinned by digest rather than tag for
        # the same reason the deployment images are (REM-30).
        #
        # --redact so a finding names the rule, file and commit without copying
        # the secret into a public workflow log.
        run: |
          GITLEAKS=ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS" \
            detect --source /repo --log-opts="--all" --redact --no-banner --verbose

  # -------------------------------------------------------------------------
  # 4. Lint & type-check
  # -------------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev,docs]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy nlqueries/

  # -------------------------------------------------------------------------
  # 3. Tests (matrix across supported Python versions)
  # -------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Not lock-audit: it downloads the lock's whole closure (torch and the CUDA
    # wheels) to check hashes, so waiting on it would hold the matrix back
    # rather than fail it cheaply. It still fails this run, and release.yml's
    # `needs: [ci]` waits for it like every other job here.
    needs: [boundary-check, security, lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: pip install -e ".[dev,docs]"

      - name: Run pytest with coverage
        run: pytest --cov=nlqueries --cov-report=xml --cov-report=term-missing
        env:
          # Why this is set is not recorded. It was once explained, in
          # scripts/test-in-container.sh, as avoiding a 409 on the reaper's fixed
          # container name -- but the reaper names itself with a per-process uuid4,
          # so that cannot have been it, and with the reaper enabled the suite
          # passes and strands nothing. On an ephemeral runner it makes no
          # observable difference either way, so this is left as it is rather than
          # changed on a guess. If it ever needs touching, start by finding out
          # what the original failure actually was. This is the only copy:
          # release.yml no longer runs its own Pytest step but calls this
          # workflow, so a release runs the suite with this same setting.
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
