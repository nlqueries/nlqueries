# NLQueries golden question set
# Used by: benchmarks/run_bench.py, Phase 3/7/9/11 regression tests.
#
# Schema
# ------
# q:               Natural-language question (string)
# agent:           Agent ID whose KB to use (string)
# expect_tables:   Table names that MUST appear in the generated SQL (list, optional)
# expect_contains: Strings that MUST appear in the answer text (list, optional)
# hard:            True when self-consistency (P9) should be triggered (bool, default false)
#
# How to run
# ----------
# python -m benchmarks.run_bench --golden tests/golden/questions.yaml --agent <agent-id>

# ---------------------------------------------------------------------------
# Sales / Orders
# ---------------------------------------------------------------------------

- q: Total revenue by region for the last 12 months
  agent: sales-agent
  expect_tables: [orders, regions]
  expect_contains: []
  hard: false

- q: Top 10 customers by order value this year
  agent: sales-agent
  expect_tables: [orders, customers]
  expect_contains: []
  hard: false

- q: Month-over-month revenue growth for 2025
  agent: sales-agent
  expect_tables: [orders]
  expect_contains: []
  hard: true

- q: Which products have a return rate above 5 percent?
  agent: sales-agent
  expect_tables: [orders, products]
  expect_contains: []
  hard: false

- q: Average order value per sales channel in Q1 2026
  agent: sales-agent
  expect_tables: [orders]
  expect_contains: []
  hard: false

- q: Customers who placed more than 3 orders but spent less than $100 total
  agent: sales-agent
  expect_tables: [orders, customers]
  expect_contains: []
  hard: true

- q: Revenue versus target by region for March 2026
  agent: sales-agent
  expect_tables: [orders, targets]
  expect_contains: []
  hard: true

- q: How many orders were shipped late last quarter?
  agent: sales-agent
  expect_tables: [orders]
  expect_contains: []
  hard: false

- q: Which SKUs had zero sales in the last 30 days?
  agent: sales-agent
  expect_tables: [orders, products]
  expect_contains: []
  hard: false

- q: Daily active users for the past week
  agent: sales-agent
  expect_tables: []
  expect_contains: []
  hard: false

