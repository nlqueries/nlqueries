[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlqueries-core"
version = "0.3.0"
description = "Open source natural language to SQL (NL2SQL) engine with schema validation and an MCP server for Claude and Cursor."
readme = "README.md"
license = { file = "LICENSE" }
# Upper bound = the first version CI does not test. Keep it in step with the
# matrix in .github/workflows/ci.yml; a bound that is not tied to something
# checkable is one that outlives its reason. The previous <3.14 was added for
# langchain_text_splitters, which was removed five days later, and the cap then
# stood for seven weeks after the thing it described had gone.
requires-python = ">=3.11,<3.15"
keywords = ["nlp", "sql", "natural-language", "mcp", "query"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
dependencies = [
    # CLI
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",

    # Database connectivity (Postgres is the only bundled driver)
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",

    # SQL parsing / dialect normalisation
    "sqlglot>=23.0",

    # Knowledge base
    "pyyaml>=6.0",

    # Embeddings + vector store
    "sentence-transformers>=3.0",
    # >=1.10, not >=1.9: `query_points` (the Universal Query API) arrived in the
    # client at 1.10, alongside the server API. A resolved 1.9.x raises
    # AttributeError at every search call site, which the `except Exception`
    # handlers turn back into an empty result -- a silent loss of caching,
    # dynamic context and document retrieval. Verified: 1.9.2 has no
    # `query_points`, 1.10.0 does.
    #
    # This floor is about the API existing, not about matching a server. The
    # client warns when its minor differs from the server's by more than one, so
    # 1.10 against the v1.18.2 the compose file ships is reported incompatible --
    # but raising the floor to suit that server would refuse an installation
    # running its own older Qdrant with a client to match, which works. The
    # pairing is a deployment concern and is documented in docs/qdrant-setup.md;
    # requirements/core.lock pins 1.19.0, which suits the shipped server.
    "qdrant-client>=1.10",

    # OIDC token verification
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",

    # LLM
    "anthropic>=0.28",
    "litellm>=1.0",
    # Not imported here: a security floor, added knowingly as a direct
    # constraint (docs/dependency-locking.md). filelock before 4.2.1 has
    # advisories (CVE-2026-112907, CVE-2026-112913, CVE-2026-112940), and
    # litellm 1.104 and later cap it below 4, so without this a fresh install
    # resolves the vulnerable 3.x. The consequence: pip holds litellm at
    # 1.103.8, the last release without that cap, and an environment that
    # needs litellm 1.104+ (or anything else capping filelock below 4) cannot
    # install nlqueries until litellm allows filelock 4. No explicit litellm
    # cap: this floor lifts itself the moment litellm does. Remove it then.
    "filelock>=4.2.1",

    # Credential storage
    "keyring>=24.0",

    # OpenTelemetry — tracing and metrics (no-op when no exporter is configured)
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",

    # MCP server. Capped below 2.0: that release removed `mcp.server.fastmcp`
    # (now `mcp.server.mcpserver`, with a changed API surface), which
    # nlqueries/mcp_server/server.py builds on. Porting to 2.x is its own piece
    # of work — until then an uncapped range silently breaks every fresh install.
    #
    # Floored at 1.29 because that is where `RequestBodyLimitMiddleware` and
    # `DEFAULT_MAX_REQUEST_BODY_SIZE` exist: the server puts the SDK's 4 MiB
    # streamable-HTTP body cap in front of its SSE app too, and imports both at
    # module load. The authentication it builds on (`FastMCP(token_verifier=...,
    # auth=...)`, `RequireAuthMiddleware`) dates from 1.27. An older floor would
    # resolve to a release where the import fails at start-up.
    "mcp>=1.30,<2",  # 1.30 added AuthSettings.validate_token_resource

    # Validation
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # Docker-based fixtures for connector integration tests (e.g. PostgresConnector)
    "testcontainers[postgres]>=4.0",
    # Optional connector deps — installed in CI so their tests keep running
    "snowflake-connector-python>=5.0",
    "google-cloud-bigquery>=3.0",
    "google-auth>=2.20",
    # DuckDB reads local files through table functions, so the security corpus
    # needs it present to check that it cannot.
    "duckdb>=1.0",
]
# Alternate embed-server daemon backend — lighter-weight ONNX Runtime instead
# of the sentence-transformers/PyTorch path, which is a base dependency.
onnx      = ["optimum[onnxruntime]>=1.17"]
# Cloud database connectors
snowflake = ["snowflake-connector-python>=5.0"]
# google-auth 2.20 is the first with load_credentials_from_dict, which the
# connector uses for a Workload Identity Federation configuration given as JSON.
bigquery  = ["google-cloud-bigquery>=3.0", "google-auth>=2.20"]
# Dialect extras for users who only need one driver
mysql     = ["pymysql>=1.1"]
openai    = ["openai>=1.0"]
# Tier-1 additional database connectors
redshift  = ["redshift-connector>=2.1"]
# 2.4.3 is the first release that applies its `encryption` argument; earlier
# ones accept it and connect unencrypted whatever it says.
mssql     = ["pymssql>=2.4.3"]
duckdb    = ["duckdb>=0.10"]
# Document ingestion connectors (PDF, Word, Excel, etc.)
docs      = ["pdfplumber>=0.11", "python-docx>=1.1", "openpyxl>=3.1"]
# Wiki connectors (Notion, Confluence, etc.)
wiki      = ["notion-client>=2.2", "atlassian-python-api>=3.41", "beautifulsoup4>=4.12"]

[project.scripts]
nlqueries     = "nlqueries.cli.main:cli"
nlq           = "nlqueries.cli.main:cli"
nlqueries-mcp = "nlqueries.mcp_server.server:main"

[project.urls]
Homepage      = "https://nlqueries.com"
Documentation = "https://nlqueries.com/docs/"
Repository    = "https://github.com/nlqueries/nlqueries"
Changelog     = "https://github.com/nlqueries/nlqueries/blob/main/CHANGELOG.md"
Issues        = "https://github.com/nlqueries/nlqueries/issues"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["nlqueries"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["nlqueries", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use literal test secrets and temporary paths, build SQL for
# their fixtures, bind test servers to every interface, start processes and
# open URLs on local test servers.
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S310", "S603", "S607", "S608"]
# The CLI, and the scripts beside the package, print by design.
"nlqueries/cli/**" = ["T20"]
"scripts/**" = ["T20"]
"benchmarks/**" = ["T20"]
# being reworked separately; remove when that lands
"nlqueries/feedback/promoter.py" = ["S110"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ARCHITECTURAL RULE: core/ must NEVER import from the enterprise layer.
# Rule TID251 fires on any matching import; violations fail ruff check and break CI.
"enterprise"           = {msg = "core/ must not import from the enterprise package"}
"nlqueries_enterprise" = {msg = "core/ must not import from the enterprise package"}

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short -q"
markers = [
    # The disposable security lab: real containers, real payloads, assertions
    # about the absence of an effect. Run them alone with `-m security`.
    "security: reproduces a security finding against a disposable database",
    "slow: takes long enough to be worth skipping during a tight edit loop",
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.12"
strict                 = true
ignore_missing_imports = true
