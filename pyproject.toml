[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlqueries-core"
version = "0.2.0"
description = "Natural-language query engine — open-source core (CLI, connectors, MCP server)"
readme = "README.md"
license = { file = "LICENSE" }
# Upper bound = the first version CI does not test. Keep it in step with the
# matrix in .github/workflows/ci.yml; a bound that is not tied to something
# checkable is one that outlives its reason. The previous <3.14 was added for
# langchain_text_splitters, which was removed five days later, and the cap then
# stood for seven weeks after the thing it described had gone.
requires-python = ">=3.11,<3.15"
keywords = ["nlp", "sql", "natural-language", "mcp", "query"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
dependencies = [
    # CLI
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",

    # Database connectivity (Postgres is the only bundled driver)
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",

    # SQL parsing / dialect normalisation
    "sqlglot>=23.0",

    # Knowledge base
    "pyyaml>=6.0",

    # Embeddings + vector store
    "sentence-transformers>=3.0",
    # >=1.10, not >=1.9: `query_points` (the Universal Query API) arrived in the
    # client at 1.10, alongside the server API. A resolved 1.9.x raises
    # AttributeError at every search call site, which the `except Exception`
    # handlers turn back into an empty result -- a silent loss of caching,
    # dynamic context and document retrieval. Verified: 1.9.2 has no
    # `query_points`, 1.10.0 does.
    "qdrant-client>=1.10",

    # OIDC token verification
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",

    # LLM
    "anthropic>=0.28",
    "litellm>=1.0",

    # Credential storage
    "keyring>=24.0",

    # OpenTelemetry — tracing and metrics (no-op when no exporter is configured)
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",

    # MCP server. Capped below 2.0: that release removed `mcp.server.fastmcp`
    # (now `mcp.server.mcpserver`, with a changed API surface), which
    # nlqueries/mcp_server/server.py builds on. Porting to 2.x is its own piece
    # of work — until then an uncapped range silently breaks every fresh install.
    #
    # Floored at 1.27 because that is where `FastMCP(token_verifier=..., auth=...)`
    # and `RequireAuthMiddleware` exist. The old `>=1.0` floor would resolve to a
    # release with no authentication support at all, and the failure would be an
    # AttributeError at start-up on the one code path that must not be optional.
    "mcp>=1.27,<2",

    # Validation
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # Docker-based fixtures for connector integration tests (e.g. PostgresConnector)
    "testcontainers[postgres]>=4.0",
    # Optional connector deps — installed in CI so their tests keep running
    "snowflake-connector-python>=3.0",
    "google-cloud-bigquery>=3.0",
    # DuckDB reads local files through table functions, so the security corpus
    # needs it present to check that it cannot.
    "duckdb>=1.0",
]
# Alternate embed-server daemon backend — lighter-weight ONNX Runtime instead
# of the sentence-transformers/PyTorch path, which is a base dependency.
onnx      = ["optimum[onnxruntime]>=1.17"]
# Cloud database connectors
snowflake = ["snowflake-connector-python>=3.0"]
bigquery  = ["google-cloud-bigquery>=3.0"]
# Dialect extras for users who only need one driver
mysql     = ["pymysql>=1.1"]
openai    = ["openai>=1.0"]
# Tier-1 additional database connectors
redshift  = ["redshift-connector>=2.1"]
mssql     = ["pymssql>=2.3"]
duckdb    = ["duckdb>=0.10"]
# Document ingestion connectors (PDF, Word, Excel, etc.)
docs      = ["pdfplumber>=0.11", "python-docx>=1.1", "openpyxl>=3.1"]
# Wiki connectors (Notion, Confluence, etc.)
wiki      = ["notion-client>=2.2", "atlassian-python-api>=3.41", "beautifulsoup4>=4.12"]

[project.scripts]
nlqueries     = "nlqueries.cli.main:cli"
nlq           = "nlqueries.cli.main:cli"
nlqueries-mcp = "nlqueries.mcp_server.server:main"

[project.urls]
Homepage   = "https://github.com/nlqueries/nlqueries"
Repository = "https://github.com/nlqueries/nlqueries"
Issues     = "https://github.com/nlqueries/nlqueries/issues"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["nlqueries"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["nlqueries", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ARCHITECTURAL RULE: core/ must NEVER import from the enterprise layer.
# Rule TID251 fires on any matching import; violations fail ruff check and break CI.
"enterprise"           = {msg = "core/ must not import from the enterprise package"}
"nlqueries_enterprise" = {msg = "core/ must not import from the enterprise package"}

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short -q"
markers = [
    # The disposable security lab: real containers, real payloads, assertions
    # about the absence of an effect. Run them alone with `-m security`.
    "security: reproduces a security finding against a disposable database",
    "slow: takes long enough to be worth skipping during a tight edit loop",
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.12"
strict                 = true
ignore_missing_imports = true
