[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nlqueries-core"
version = "0.1.0"
description = "Natural-language query engine — open-source core (CLI, connectors, MCP server)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
keywords = ["nlp", "sql", "natural-language", "mcp", "query"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
dependencies = [
    # CLI
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",

    # Database connectivity (Postgres is the only bundled driver)
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",

    # SQL parsing / dialect normalisation
    "sqlglot>=23.0",

    # Knowledge base
    "pyyaml>=6.0",

    # Vector store
    "qdrant-client>=1.9",

    # OIDC token verification
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",

    # LLM
    "anthropic>=0.28",
    "litellm>=1.0",

    # Credential storage
    "keyring>=24.0",

    # OpenTelemetry — tracing and metrics (no-op when no exporter is configured)
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",

    # MCP server
    "mcp>=1.0",

    # Validation
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    # Docker-based fixtures for connector integration tests (e.g. PostgresConnector)
    "testcontainers[postgres]>=4.0",
    # Optional connector/embedding deps — installed in CI so their tests keep running
    "sentence-transformers>=3.0",
    "snowflake-connector-python>=3.0",
    "google-cloud-bigquery>=3.0",
]
# Embedding backends
torch     = ["sentence-transformers>=3.0"]
onnx      = ["optimum[onnxruntime]>=1.17"]
# Cloud database connectors
snowflake = ["snowflake-connector-python>=3.0"]
bigquery  = ["google-cloud-bigquery>=3.0"]
# Dialect extras for users who only need one driver
mysql     = ["pymysql>=1.1"]
openai    = ["openai>=1.0"]
# Tier-1 additional database connectors
redshift  = ["redshift-connector>=2.1"]
mssql     = ["pymssql>=2.3"]
duckdb    = ["duckdb>=0.10"]
# Document ingestion connectors (PDF, Word, Excel, etc.)
docs      = ["pdfplumber>=0.11", "langchain-text-splitters>=0.3", "python-docx>=1.1", "openpyxl>=3.1"]
# Wiki connectors (Notion, Confluence, etc.)
wiki      = ["notion-client>=2.2", "langchain-text-splitters>=0.3", "atlassian-python-api>=3.41", "beautifulsoup4>=4.12"]

[project.scripts]
nlqueries = "nlqueries.cli.main:cli"
nlq       = "nlqueries.cli.main:cli"

[project.urls]
Homepage   = "https://github.com/nlqueries/nlqueries"
Repository = "https://github.com/nlqueries/nlqueries"
Issues     = "https://github.com/nlqueries/nlqueries/issues"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["nlqueries"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["nlqueries", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ARCHITECTURAL RULE: core/ must NEVER import from the enterprise layer.
# Rule TID251 fires on any matching import; violations fail ruff check and break CI.
"enterprise"           = {msg = "core/ must not import from the enterprise package"}
"nlqueries_enterprise" = {msg = "core/ must not import from the enterprise package"}

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short -q"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.12"
strict                 = true
ignore_missing_imports = true
